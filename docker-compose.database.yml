services:
  database:
    image: timescale/timescaledb:2.27.0-pg16
    environment:
      POSTGRES_DB: predecessor_build
      POSTGRES_USER: predecessor
      POSTGRES_PASSWORD: predecessor
    ports:
      - "5432:5432"
    volumes:
      - riftline_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U predecessor -d predecessor_build"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  riftline_postgres_data:
