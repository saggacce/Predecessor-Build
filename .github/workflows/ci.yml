name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  ci:
    name: Type-check & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate --schema=workers/data-sync/prisma/schema.prisma

      - name: Type-check (backend + shared)
        run: npx tsc --noEmit

      - name: Build frontend (catches tsc -b errors missed by root tsconfig)
        run: npm run build --workspace apps/web

      - name: Run tests
        run: npx vitest run
